name: Test Upgrade

on:
  workflow_dispatch:
    inputs:
      remote:
        description: "Incus remote to test against"
        required: true
        default: "ict-daily"
        type: string
      fixture:
        description: "Fixture directory to test"
        required: true
        default: "test/fixtures/two-services"
        type: string

# The self-hosted runners share the ict-* remotes, so only one run at a time.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # https://stackoverflow.com/a/79780883/3368468
  GOTOOLCHAIN: "go1.27.0+auto"
  REPORTS_DIR: reports
  PROJECT_ROOT: ${{ github.workspace }}
  INCUS_COMPOSE_NETWORK_UPLINK: "incusbr0"

jobs:
  test-upgrade:
    runs-on: [self-hosted, incus-compose, default]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      INCUS_REMOTE: ${{ inputs.remote || 'ict-daily' }}
      INCUS_COMPOSE_IMAGE_CACHE: incus-compose-tests-cache
      NO_COLOR: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Incus version
        run: |
          incus version

      - name: Cleanup
        run: |
          just purge-projects || true
          just purge-networks || true

      - name: Set version
        run: |
          mkdir -p "$REPORTS_DIR"
          sha="${{ github.sha }}"
          short="${sha:0:7}"
          echo "VERSION=${short}" >> "$GITHUB_ENV"

      - name: Run upgrade test
        run: |
          ./scripts/test-upgrade.sh "${{ inputs.fixture || 'test/fixtures/two-services' }}"

      - name: Post-test cleanup
        if: always()
        run: |
          just purge-projects || true
          just purge-networks || true
